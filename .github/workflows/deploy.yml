name: Build My Apps
on:
  push:
    branches: [ master, main ]
jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build APK
        id: build
        uses: flet-dev/flet-build-action@v1
        with:
          target: apk
          # On force à regarder dans le dossier principal
          project-path: "."
          # On spécifie ton fichier de démarrage principal
          python-entry-script: "main.py"
      - name: Upload APK File
        uses: actions/upload-artifact@v4
        with:
          name: my-phone-app
          path: ${{ steps.build.outputs.archive-path }}
