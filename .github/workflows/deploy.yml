name: Generer Mon APK
on:
  push:
    branches: [ master, main ]
jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurer Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configurer Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0' # Version stable et ultra-compatible
          channel: 'stable'

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer Flet
        run: |
          python -m pip install --upgrade pip
          pip install flet

      - name: Réparer et Compiler l'APK
        run: |
          # Cette commande force Flet à initialiser proprement le projet Flutter
          flet build apk --verbose

      - name: Sauvegarder l'APK
        uses: actions/upload-artifact@v4
        with:
          name: MonApplicationAndroid
          path: build/apk/
