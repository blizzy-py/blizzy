name: Build My Apps
on:
  push:
    branches: [ master, main ]
jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer Flet et les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install flet

      - name: Configurer Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Compiler l'APK Android
        run: |
          flet build apk --no-config

      - name: Téléverser le fichier APK
        uses: actions/upload-artifact@v4
        with:
          name: my-phone-app
          path: build/apk/
