name: blizz
on:
  push:
    branches: [ main, master ]
jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build APK
        id: build
        uses: flet-dev/flet-build-action@v1
        with:
          target: apk
      - name: Upload APK File
        uses: actions/upload-artifact@v4
        with:
          name: blizz-app
          path: ${{ steps.build.outputs.archive-path }}
